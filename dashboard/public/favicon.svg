<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#7dcfff" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0c0e17" stroke="#252b42" stroke-width="4"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#grad)" stroke-width="6" opacity="0.3"/>
  <polygon points="42,32 70,50 42,68" fill="url(#grad)" filter="url(#glow)"/>
</svg>
