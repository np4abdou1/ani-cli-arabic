name: Build and Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v2.0.0)"
        required: false
        type: string
      changelogs:
        description: "Release changelogs"
        required: false
        default: "Bug fixes and improvements"
        type: string

permissions:
  contents: write
  actions: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Determine Version and Create Release if needed
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.changelogs || 'Major changes please read changelogs' }}
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(python3 -c "from src.version import __version__; print(__version__)")"
          fi
          if [[ $VERSION != v* ]]; then VERSION="v$VERSION"; fi
          echo "Target Version: $VERSION"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists on GitHub."
          else
            echo "$NOTES" > release_notes.md
            gh release create "$VERSION" --title "Release $VERSION" --notes-file release_notes.md
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Version
        id: ver
        shell: pwsh
        run: |
          $event = "${{ github.event_name }}"
          $inputVer = "${{ inputs.version }}"
          $refName = "${{ github.ref_name }}"
          $relTag = "${{ github.event.release.tag_name }}"
          
          if ($event -eq "release" -and $relTag) {
            $version = $relTag
          } elseif ($inputVer) {
            $version = $inputVer
          } elseif ($refName -and "${{ github.ref }}" -like "refs/tags/*") {
            $version = $refName
          } else {
            $cleanVer = (python -c "from src.version import __version__; print(__version__)").Trim()
            $version = "v$cleanVer"
          }
          if (-not $version.StartsWith("v")) { $version = "v$version" }
          Write-Host "Resolved Version: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Inject version into source
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.VERSION }}"
          $cleanVer = $version -replace '^v', ''
          
          # Update version.py with the release version
          (Get-Content src/version.py) -replace '__version__ = .*', "__version__ = `"$cleanVer`"" | Set-Content src/version.py
          
          # Parse version numbers - strip any non-numeric suffix
          $cleanVerNum = $version -replace '^v', '' -replace '-.*$', ''
          $verParts = $cleanVerNum.Split('.')
          $major = if ($verParts.Length -gt 0) { [int]$verParts[0] } else { 2 }
          $minor = if ($verParts.Length -gt 1) { [int]$verParts[1] } else { 0 }
          $patch = if ($verParts.Length -gt 2) { [int]$verParts[2] } else { 0 }
          $fullVersion = $cleanVer
          
          # Create version_info.txt
          $content = "VSVersionInfo("
          $content += "`n  ffi=FixedFileInfo("
          $content += "`n    filevers=($major, $minor, $patch, 0),"
          $content += "`n    prodvers=($major, $minor, $patch, 0),"
          $content += "`n    mask=0x3f,"
          $content += "`n    flags=0x0,"
          $content += "`n    OS=0x40004,"
          $content += "`n    fileType=0x1,"
          $content += "`n    subtype=0x0,"
          $content += "`n    date=(0, 0)"
          $content += "`n  ),"
          $content += "`n  kids=["
          $content += "`n    StringFileInfo("
          $content += "`n      ["
          $content += "`n        StringTable("
          $content += "`n          u'040904B0',"
          $content += "`n          ["
          $content += "`n            StringStruct(u'CompanyName', u'np4abdou1'),"
          $content += "`n            StringStruct(u'FileDescription', u'ani-cli-arabic - Arabic Anime CLI'),"
          $content += "`n            StringStruct(u'FileVersion', u'$fullVersion'),"
          $content += "`n            StringStruct(u'InternalName', u'ani-cli-arabic'),"
          $content += "`n            StringStruct(u'LegalCopyright', u'MIT License'),"
          $content += "`n            StringStruct(u'OriginalFilename', u'ani-cli-arabic-win64.exe'),"
          $content += "`n            StringStruct(u'ProductName', u'ani-cli-arabic'),"
          $content += "`n            StringStruct(u'ProductVersion', u'$fullVersion')"
          $content += "`n          ]"
          $content += "`n        )"
          $content += "`n      ]"
          $content += "`n    ),"
          $content += "`n    VarFileInfo([VarStruct(u'Translation', [1033, 1200])])"
          $content += "`n  ]"
          $content += "`n)"
          $content | Out-File -FilePath "version_info.txt" -Encoding utf8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download MPV
        shell: pwsh
        run: |
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers @{"User-Agent"="GitHub-Actions"}
            $asset = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-\d+.*\.7z$' } | Select-Object -First 1
            $mpvUrl = if ($asset) { $asset.browser_download_url } else { "https://sourceforge.net/projects/mpv-player-windows/files/64bit/mpv-x86_64-20261011-git-accb7b2821.7z/download" }
          } catch {
            $mpvUrl = "https://sourceforge.net/projects/mpv-player-windows/files/64bit/mpv-x86_64-20261011-git-accb7b2821.7z/download"
          }
          Write-Host "Downloading MPV from $mpvUrl"
          Invoke-WebRequest -Uri $mpvUrl -OutFile "mpv.7z"
          7z x mpv.7z
          Copy-Item -Path "mpv.exe" -Destination "mpv_bundle.exe" -Force

      - name: Build executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build
          $currentDir = Get-Location
          $version = "${{ steps.ver.outputs.VERSION }}"
          
          # Build without MPV
          pyinstaller --onefile --name "ani-cli-arabic-windows-x64-$version" --console --clean --noconfirm --distpath . --workpath build --specpath build --icon "$currentDir\assets\icon.ico" --version-file "$currentDir\version_info.txt" --add-data "$currentDir\src;src" --hidden-import pypresence --hidden-import rich --hidden-import requests --hidden-import cryptography --hidden-import cryptography.fernet --hidden-import curl_cffi --hidden-import bs4 --hidden-import arabic_reshaper --hidden-import bidi --hidden-import bidi.algorithm --hidden-import Cryptodome main.py
          
          # Build with MPV
          pyinstaller --onefile --name "ani-cli-arabic-windows-x64-$version-with-mpv" --console --clean --noconfirm --distpath . --workpath build --specpath build --icon "$currentDir\assets\icon.ico" --version-file "$currentDir\version_info.txt" --add-data "$currentDir\src;src" --add-binary "$currentDir\mpv_bundle.exe;mpv" --hidden-import pypresence --hidden-import rich --hidden-import requests --hidden-import cryptography --hidden-import cryptography.fernet --hidden-import curl_cffi --hidden-import bs4 --hidden-import arabic_reshaper --hidden-import bidi --hidden-import bidi.algorithm --hidden-import Cryptodome main.py

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.ver.outputs.VERSION }}"
          gh release upload "$version" "ani-cli-arabic-windows-x64-$version.exe" "ani-cli-arabic-windows-x64-$version-with-mpv.exe" --clobber

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(python3 -c "from src.version import __version__; print(__version__)")"
          fi
          if [[ $VERSION != v* ]]; then VERSION="v$VERSION"; fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved Linux Version: $VERSION"

      - name: Inject version into source
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          CLEAN_VER="${VERSION#v}"
          sed -i "s/__version__ = .*/__version__ = \"$CLEAN_VER\"/" src/version.py
          cat src/version.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv libmpv-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executables
        run: |
          PWD=$(pwd)
          VERSION="${{ steps.ver.outputs.VERSION }}"
          
          # Build without MPV
          pyinstaller --onefile --name "ani-cli-arabic-linux-x64-$VERSION" --console --clean --noconfirm --distpath . --workpath build --specpath build --add-data "$PWD/src:src" --hidden-import pypresence --hidden-import rich --hidden-import requests --hidden-import cryptography --hidden-import cryptography.fernet --hidden-import curl_cffi --hidden-import bs4 --hidden-import arabic_reshaper --hidden-import bidi --hidden-import bidi.algorithm --hidden-import Cryptodome main.py
          
          # Build with MPV
          MPV_PATH=$(which mpv)
          pyinstaller --onefile --name "ani-cli-arabic-linux-x64-$VERSION-with-mpv" --console --clean --noconfirm --distpath . --workpath build --specpath build --add-data "$PWD/src:src" --add-binary "${MPV_PATH}:mpv" --hidden-import pypresence --hidden-import rich --hidden-import requests --hidden-import cryptography --hidden-import cryptography.fernet --hidden-import curl_cffi --hidden-import bs4 --hidden-import arabic_reshaper --hidden-import bidi --hidden-import bidi.algorithm --hidden-import Cryptodome main.py

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          gh release upload "$VERSION" "ani-cli-arabic-linux-x64-$VERSION" "ani-cli-arabic-linux-x64-$VERSION-with-mpv" --clobber