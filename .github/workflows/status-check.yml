name: Provider Health Check & Status

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:        # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  check-providers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run provider health checks
        run: |
          python scripts/check_providers.py

      - name: Commit updated status.json if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Status Bot]"
          git add status.json website/public/status.json 2>/dev/null || git add status.json
          git diff --staged --quiet || (git commit -m "chore(status): update provider health metrics [skip ci]" && git push)
