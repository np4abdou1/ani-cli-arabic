name: Provider Health Check & Status

on:
  schedule:
    - cron: '14,44 * * * *'  # Runs every 30 mins at off-peak minutes (14 and 44) to prevent GitHub cron dropping
  workflow_dispatch:        # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  check-providers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run provider health checks
        run: |
          python scripts/check_providers.py

      - name: Publish to dedicated status-data branch (0 commits on main)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Status Bot]"

          # Copy generated status payload
          cp status.json /tmp/status.json

          # Switch to orphan branch status-data so main branch remains completely clean
          git checkout --orphan status-data 2>/dev/null || git checkout status-data
          git rm -rf . > /dev/null 2>&1 || true

          # Keep only status.json on this branch
          cp /tmp/status.json status.json
          git add status.json
          git commit -m "status: update live provider telemetry" --amend -m "status: update live provider telemetry" 2>/dev/null || git commit -m "status: update live provider telemetry"
          git push -f origin status-data
